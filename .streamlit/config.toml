# "Obsidian Ranker" theme — luxury matte dark (deep obsidian + charcoal glass).
# Applied by Streamlit locally and on Community Cloud / HF Spaces.
[theme]
base = "dark"
primaryColor = "#C8CACD"
backgroundColor = "#121316"
secondaryBackgroundColor = "#1E2023"
textColor = "#EDEEF0"
font = "sans serif"

[client]
toolbarMode = "minimal"
