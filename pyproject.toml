[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-runs"
version = "0.1.0"
description = "Intelligent candidate discovery for the India Runs hackathon (Track 1)."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["ir*", "ranking*", "embeddings*", "evaluation*", "preprocessing*"]
