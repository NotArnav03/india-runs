# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"        # Claude Code: architecture, implementation, code review, tests

ai_usage_summary: |
  Built with Claude Code as a pair-engineering tool: gap analysis against the
  dataset, implementation of the ranking pipeline and tests, and code review.
  All design decisions, the JD requirement model, and the scoring weights were
  human-directed. No candidate data was sent to any hosted LLM, and the ranking
  step itself makes no LLM/API calls (offline, CPU-only).

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  The JD states plainly that keyword/embedding matching is a trap, so our ranker
  leads with career evidence and behavior, not buzzwords. Built on a vendored,
  license-clean subset of the FAIMR retrieval/ranking core, it models the single
  JD explicitly (must/nice skills, hard disqualifiers, locations) and scores each
  candidate by blending normalized signals: SBERT semantic fit against the
  profile's career narrative, an anchored skill match, and ten career/behavioral
  features over the 23 Redrob signals — shipped-systems evidence,
  product-vs-services trajectory, role coherence, skill credibility,
  experience-band fit, tenure, availability, engagement, GitHub, location. Raw
  similarity is deliberately down-weighted. Hard JD disqualifiers and a
  within-profile consistency check are applied as multiplicative guards, so
  keyword-stuffers, off-target roles, consulting-only careers, and the ~80
  planted honeypots sink out of contention. Each shortlist row gets a 1–2
  sentence justification built only from profile facts, with honest concerns
  surfaced. No labels ship with the data, so the ranker is unsupervised; the rank
  step runs in ~80s for 100K candidates on CPU with no network. Locally validated
  against a JD-grounded judgment set (official composite ≈0.98, 0% honeypots in
  the top 10).

